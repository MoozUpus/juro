<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="lawyer-title lawyer-desc">
  <title id="lawyer-title">Lawyer hand-off</title><desc id="lawyer-desc">A three-step hand-off from AI assistance through preserved case context to requested lawyer review.</desc>
  <defs>
    <linearGradient id="lawyer-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#031B30"/><stop offset=".62" stop-color="#062844"/><stop offset="1" stop-color="#0B314C"/>
    </linearGradient>
    <linearGradient id="lawyer-gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#A77A31"/><stop offset=".52" stop-color="#DEC27F"/><stop offset="1" stop-color="#BE974F"/>
    </linearGradient>
    <radialGradient id="lawyer-glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#BE974F" stop-opacity=".18"/><stop offset="1" stop-color="#BE974F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lawyer-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#DDE8EE" stroke-opacity=".065"/>
    </pattern>
    <filter id="lawyer-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00101E" flood-opacity=".25"/>
    </filter>
    <filter id="lawyer-softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#00101E" flood-opacity=".16"/>
    </filter>
  </defs><style>
    .ui{font-family:Inter,Manrope,"Segoe UI",Arial,sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}
    .caps{font-weight:800;letter-spacing:2.2px}.tiny{font-size:13px}.small{font-size:16px}.body{font-size:19px}.title{font-size:28px;font-weight:800}.muted{fill:#657985}
  </style>
  <rect width="1600" height="520" rx="28" fill="#F8F6F2"/><text x="68" y="58" class="ui caps" font-size="13" fill="#BE974F">HUMAN LAYER / CONTROLLED HAND-OFF</text><text x="1532" y="58" text-anchor="end" class="ui caps" font-size="11" fill="#657985">PARTIAL WORKFLOW · WHERE AVAILABLE</text><text x="68" y="110" class="serif" font-size="42" font-weight="700" fill="#112B3E">AI when useful. A lawyer when needed.</text>

  <path d="M300 292H1300" stroke="#C9D3D8" stroke-width="2"/><path d="M1290 285l12 7-12 7" fill="none" stroke="#BE974F" stroke-width="2"/>
  <g transform="translate(70 166)"><rect width="454" height="202" rx="21" fill="#FFFDFC" stroke="#D9E0E3"/><text x="25" y="40" class="ui caps" font-size="11" fill="#BE974F">01 / AI ASSISTANCE</text><text x="25" y="91" class="ui" font-size="26" font-weight="850" fill="#112B3E">Question + answer</text><text x="25" y="129" class="ui" font-size="15" fill="#657985">AI structures the request.</text><g transform="translate(25 151)"><rect width="142" height="32" rx="16" fill="#E7F3EC"/><circle cx="17" cy="16" r="4" fill="#2E7658"/><text x="29" y="21" class="ui caps" font-size="10" fill="#2E7658">PROCESSING</text></g></g><g transform="translate(580 166)"><rect width="454" height="202" rx="21" fill="#FFFDFC" stroke="#D9E0E3"/><text x="25" y="40" class="ui caps" font-size="11" fill="#BE974F">02 / CASE CONTEXT</text><text x="25" y="91" class="ui" font-size="26" font-weight="850" fill="#112B3E">Sources + documents</text><text x="25" y="129" class="ui" font-size="15" fill="#657985">Evidence travels with the case.</text><g transform="translate(25 151)"><rect width="142" height="32" rx="16" fill="#E7F3EC"/><circle cx="17" cy="16" r="4" fill="#2E7658"/><text x="29" y="21" class="ui caps" font-size="10" fill="#2E7658">PROTECTED</text></g></g><g transform="translate(1090 166)"><rect width="454" height="202" rx="21" fill="#062844" stroke="#BE974F"/><text x="25" y="40" class="ui caps" font-size="11" fill="#BE974F">03 / LAWYER REVIEW</text><text x="25" y="91" class="ui" font-size="26" font-weight="850" fill="#fff">Human judgment</text><text x="25" y="129" class="ui" font-size="15" fill="#BDCED7">The user requests assistance.</text><g transform="translate(25 151)"><rect width="142" height="32" rx="16" fill="#F5ECD7"/><circle cx="17" cy="16" r="4" fill="#BE974F"/><text x="29" y="21" class="ui caps" font-size="10" fill="#795B22">REQUESTABLE</text></g></g>
  <rect x="70" y="401" width="1474" height="66" rx="16" fill="#F5ECD7"/><text x="98" y="429" class="ui caps" font-size="10" fill="#745317">CONTEXT PRESERVED</text><text x="98" y="452" class="ui" font-size="17" font-weight="800" fill="#112B3E">Transfer the case without explaining everything again.</text><text x="1516" y="442" text-anchor="end" class="ui caps" font-size="10" fill="#745317">HUMAN ASSISTANCE · WHERE AVAILABLE</text>

</svg>
