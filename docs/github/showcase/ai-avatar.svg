  <g transform="translate(76 76)"><text class="ui caps" font-size="13" fill="#DEC27F">JURO LAB / HUMAN-CENTRED AI</text><text y="75" class="serif" font-size="58" font-weight="700" fill="#fff">AI Avatar</text><g transform="translate(0 105)"><rect width="170" height="32" rx="16" fill="#F5ECD7"/><circle cx="17" cy="16" r="4" fill="#BE974F"/><text x="29" y="21" class="ui caps" font-size="10" fill="#795B22">IN DEVELOPMENT</text></g><text y="190" class="ui" font-size="23" font-weight="800" fill="#fff">A visual AI legal assistant designed for</text><text y="224" class="ui" font-size="23" font-weight="800" fill="#fff">more natural and accessible interaction.</text><text y="275" class="ui" font-size="16" fill="#BDCED6">No face claim. No production claim. A clear development track.</text>
