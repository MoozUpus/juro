<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1020" viewBox="0 0 760 1020" role="img" aria-labelledby="lawyer-mobile-title lawyer-mobile-desc">
  <title id="lawyer-mobile-title">Lawyer hand-off</title><desc id="lawyer-mobile-desc">A three-step hand-off from AI assistance through preserved case context to requested lawyer review.</desc>
  <defs>
    <linearGradient id="lawyer-mobile-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#031B30"/><stop offset=".62" stop-color="#062844"/><stop offset="1" stop-color="#0B314C"/>
    </linearGradient>
    <linearGradient id="lawyer-mobile-gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#A77A31"/><stop offset=".52" stop-color="#DEC27F"/><stop offset="1" stop-color="#BE974F"/>
    </linearGradient>
    <radialGradient id="lawyer-mobile-glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#BE974F" stop-opacity=".18"/><stop offset="1" stop-color="#BE974F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lawyer-mobile-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#DDE8EE" stroke-opacity=".065"/>
    </pattern>
    <filter id="lawyer-mobile-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00101E" flood-opacity=".25"/>
    </filter>
    <filter id="lawyer-mobile-softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#00101E" flood-opacity=".16"/>
    </filter>
  </defs><style>
    .ui{font-family:Inter,Manrope,"Segoe UI",Arial,sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}
    .caps{font-weight:800;letter-spacing:2.2px}.tiny{font-size:13px}.small{font-size:16px}.body{font-size:19px}.title{font-size:28px;font-weight:800}.muted{fill:#657985}
  </style>
  <rect width="760" height="1020" rx="28" fill="#F8F6F2"/><text x="48" y="58" class="ui caps" font-size="13" fill="#BE974F">HUMAN LAYER / CONTROLLED HAND-OFF</text><text x="48" y="112" class="serif" font-size="40" font-weight="700" fill="#112B3E">AI when useful.</text><text x="48" y="160" class="serif" font-size="40" font-weight="700" fill="#112B3E">A lawyer when needed.</text><g transform="translate(48 182)"><rect width="166" height="32" rx="16" fill="#F5ECD7"/><circle cx="17" cy="16" r="4" fill="#BE974F"/><text x="29" y="21" class="ui caps" font-size="10" fill="#795B22">PARTIAL WORKFLOW</text></g>

  <g transform="translate(76 248)"><g transform="translate(0 0)"><rect width="608" height="142" rx="19" fill="#FFFDFC" stroke="#D9E0E3"/><text x="24" y="38" class="ui caps" font-size="11" fill="#BE974F">01 / AI ASSISTANCE</text><text x="24" y="83" class="ui" font-size="20" font-weight="800" fill="#112B3E">Question and structured context</text><path d="M304 142v48" stroke="#BE974F" stroke-width="2"/><path d="m297 180 7 10 7-10" fill="none" stroke="#BE974F" stroke-width="2"/></g><g transform="translate(0 190)"><rect width="608" height="142" rx="19" fill="#FFFDFC" stroke="#D9E0E3"/><text x="24" y="38" class="ui caps" font-size="11" fill="#BE974F">02 / CASE CONTEXT</text><text x="24" y="83" class="ui" font-size="20" font-weight="800" fill="#112B3E">Sources, documents and action history</text><path d="M304 142v48" stroke="#BE974F" stroke-width="2"/><path d="m297 180 7 10 7-10" fill="none" stroke="#BE974F" stroke-width="2"/></g><g transform="translate(0 380)"><rect width="608" height="142" rx="19" fill="#062844" stroke="#BE974F"/><text x="24" y="38" class="ui caps" font-size="11" fill="#BE974F">03 / LAWYER REVIEW</text><text x="24" y="83" class="ui" font-size="20" font-weight="800" fill="#fff">Request human assistance without starting over</text></g></g><rect x="76" y="832" width="608" height="86" rx="16" fill="#F5ECD7"/><text x="100" y="866" class="ui caps" font-size="10" fill="#76551B">CONTEXT PRESERVED</text><text x="100" y="897" class="ui" font-size="16" font-weight="800" fill="#112B3E">Transfer the case without explaining everything again.</text>

</svg>
