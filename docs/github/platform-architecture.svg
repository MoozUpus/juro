<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title desc">
  <title id="title">JURO platform architecture</title>
  <desc id="desc">The JURO monorepo architecture: browser clients, website and platform applications on Cloudflare, D1 and R2, server-side AI and email/OTP providers.</desc>
  <defs>
    <style>
      .ui { font-family: Inter, Manrope, Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .h { fill: #062844; font-size: 43px; font-weight: 700; }
      .sub { fill: #527080; font-size: 17px; }
      .layer { fill: #9b773b; font-size: 11px; font-weight: 800; letter-spacing: 2px; }
      .box { fill: #062844; font-size: 20px; font-weight: 800; }
      .copy { fill: #527080; font-size: 13px; }
      .dark-title { fill: #fff; font-size: 20px; font-weight: 800; }
      .dark-copy { fill: #bed0d9; font-size: 13px; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#BE974F"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#062844" flood-opacity=".09"/></filter>
  </defs>
  <rect width="1600" height="1030" fill="#f8f6f2"/>
  <g class="ui">
    <text x="100" y="82" class="h serif">A Cloudflare-native monorepo</text>
    <text x="100" y="126" class="h serif">with public and platform surfaces.</text>
    <text x="100" y="162" class="sub">The diagram reflects repository configuration and documented server boundaries, not a compliance certification.</text>
  </g>
  <g stroke="#dbe4e8"><path d="M100 180H1500M100 388H1500M100 650H1500M100 880H1500"/></g>
  <g class="ui">
    <text x="100" y="210" class="layer">BROWSER / CLIENT</text>
    <text x="100" y="418" class="layer">APPLICATION LAYER</text>
    <text x="100" y="680" class="layer">DATA &amp; AI LAYER</text>
    <text x="100" y="910" class="layer">EXTERNAL PROVIDERS / SECURITY BOUNDARIES</text>
  </g>
  <g filter="url(#shadow)" class="ui">
    <rect x="255" y="224" width="290" height="116" rx="18" fill="#fff" stroke="#dbe4e8"/>
    <text x="285" y="265" class="box">Public visitors</text>
    <text x="285" y="292" class="copy">juro.uz · public legal pages</text>
    <text x="285" y="314" class="copy">Website landing and resources</text>
    <rect x="1055" y="224" width="290" height="116" rx="18" fill="#fff" stroke="#dbe4e8"/>
    <text x="1085" y="265" class="box">Platform users</text>
    <text x="1085" y="292" class="copy">app.juro.uz · protected routes</text>
    <text x="1085" y="314" class="copy">Workspace, documents and cases</text>

    <rect x="250" y="445" width="355" height="160" rx="20" fill="#062844"/>
    <text x="280" y="485" class="dark-title">apps/website</text>
    <text x="280" y="514" class="dark-copy">React / Next.js App Router</text>
    <text x="280" y="537" class="dark-copy">Vite + Vinext on Cloudflare Worker</text>
    <text x="280" y="570" fill="#BE974F" font-size="12" font-weight="800">PUBLIC WEBSITE BOUNDARY</text>
    <rect x="995" y="445" width="355" height="160" rx="20" fill="#062844"/>
    <text x="1025" y="485" class="dark-title">apps/platform</text>
    <text x="1025" y="514" class="dark-copy">React / Next.js route handlers</text>
    <text x="1025" y="537" class="dark-copy">Cloudflare Worker · auth and permission checks</text>
    <text x="1025" y="570" fill="#BE974F" font-size="12" font-weight="800">PROTECTED PLATFORM BOUNDARY</text>
    <rect x="706" y="475" width="190" height="100" rx="18" fill="#f2e7d1" stroke="#BE974F"/>
    <text x="736" y="513" class="box">apps/admin</text>
    <text x="736" y="538" class="copy">Separate Worker</text>
    <text x="736" y="557" fill="#9b773b" font-size="10" font-weight="800">PARTIAL ADMIN SURFACE</text>

    <rect x="235" y="704" width="240" height="120" rx="18" fill="#fff" stroke="#dbe4e8"/>
    <text x="265" y="744" class="box">Cloudflare D1</text>
    <text x="265" y="770" class="copy">SQLite + Drizzle migrations</text>
    <text x="265" y="792" class="copy">application data</text>
    <rect x="520" y="704" width="240" height="120" rx="18" fill="#fff" stroke="#dbe4e8"/>
    <text x="550" y="744" class="box">Private R2</text>
    <text x="550" y="770" class="copy">document and file objects</text>
    <text x="550" y="792" class="copy">permission-checked retrieval</text>
    <rect x="805" y="704" width="240" height="120" rx="18" fill="#fff" stroke="#dbe4e8"/>
    <text x="835" y="744" class="box">Server-side AI</text>
    <text x="835" y="770" class="copy">OpenAI integration</text>
    <text x="835" y="792" class="copy">credentials remain server-side</text>
    <rect x="1090" y="704" width="275" height="120" rx="18" fill="#fff" stroke="#dbe4e8"/>
    <text x="1120" y="744" class="box">Generated documents</text>
    <text x="1120" y="770" class="copy">DOCX · PDF · ZIP workflows</text>
    <text x="1120" y="792" class="copy">built by the platform application</text>
  </g>
  <g fill="none" stroke="#BE974F" stroke-width="3" marker-end="url(#arr)">
    <path d="M400 340V445"/>
    <path d="M1200 340V445"/>
    <path d="M605 525H706"/>
    <path d="M896 525H995"/>
    <path d="M1170 605V685H355V704"/>
    <path d="M1170 605V665H640V704"/>
    <path d="M1170 605V645H925V704"/>
    <path d="M1170 605V625H1227V704"/>
  </g>
  <g class="ui">
    <rect x="200" y="930" width="310" height="53" rx="14" fill="#fff" stroke="#dbe4e8"/>
    <text x="225" y="963" class="copy">Email / OTP provider · server boundary</text>
    <rect x="590" y="930" width="310" height="53" rx="14" fill="#fff" stroke="#dbe4e8"/>
    <text x="615" y="963" class="copy">Public source websites · retrieval layer</text>
    <rect x="980" y="930" width="390" height="53" rx="14" fill="#fff" stroke="#dbe4e8"/>
    <text x="1005" y="963" class="copy">Cloudflare secrets and production bindings</text>
    <path d="M1170 824V930M925 824V930M355 824V930" stroke="#82949f" stroke-width="2" stroke-dasharray="7 8"/>
  </g>
</svg>
