<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="810" viewBox="0 0 1600 810" role="img" aria-labelledby="title desc">
  <title id="title">JURO platform architecture</title>
  <desc id="desc">JURO monorepo architecture with public website, protected platform, Cloudflare Workers, D1, R2 and server-side AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#041f37"/><stop offset="1" stop-color="#062844"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000d18" flood-opacity=".35"/></filter>
    <style>.ui{font-family:Inter,Manrope,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.h{fill:#fff;font-size:46px;font-weight:700}.copy{fill:#b9c9d2;font-size:17px}.layer{fill:#caa866;font-size:10px;font-weight:800;letter-spacing:1.4px}.cardh{fill:#062844;font-size:19px;font-weight:800}.cardcopy{fill:#607987;font-size:13px}.darkh{fill:#fff;font-size:19px;font-weight:800}.darkcopy{fill:#bdd0d9;font-size:13px}.badge{font-size:10px;font-weight:800;letter-spacing:1.1px}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#BE974F"/></marker>
  </defs>
  <rect width="1600" height="810" fill="url(#bg)"/><path d="M0 120H1600M0 735H1600" stroke="#dce6ed" stroke-opacity=".08"/><path d="M1190 0C1370 116 1350 194 1600 199" fill="none" stroke="#BE974F" stroke-opacity=".15"/>
  <g class="ui"><text x="100" y="96" class="h serif">A Cloudflare-native product, with explicit boundaries.</text><text x="100" y="133" class="copy">Public discovery, protected legal work and server-side integrations remain deliberately separated.</text></g>
  <g fill="none" stroke="#BE974F" stroke-width="2.5" marker-end="url(#arrow)"><path d="M370 288H450"/><path d="M720 288H800"/><path d="M1070 288H1150"/><path d="M800 420V474"/><path d="M800 602V646"/></g>
  <g class="ui" filter="url(#shadow)">
    <g transform="translate(100 215)"><text x="0" y="-18" class="layer">BROWSER / CLIENT</text><rect width="270" height="145" rx="20" fill="#f8f6f2"/><text x="24" y="43" class="badge" fill="#9b773b">PUBLIC ENTRY</text><text x="24" y="80" class="cardh">juro.uz</text><text x="24" y="106" class="cardcopy">Public legal pages and</text><text x="24" y="126" class="cardcopy">product discovery.</text></g>
    <g transform="translate(450 215)"><text x="0" y="-18" class="layer">BROWSER / CLIENT</text><rect width="270" height="145" rx="20" fill="#f8f6f2"/><text x="24" y="43" class="badge" fill="#9b773b">PROTECTED ENTRY</text><text x="24" y="80" class="cardh">app.juro.uz</text><text x="24" y="106" class="cardcopy">Legal information, documents,</text><text x="24" y="126" class="cardcopy">cases and action work.</text></g>
    <g transform="translate(800 215)"><text x="0" y="-18" class="layer">APPLICATION LAYER</text><rect width="270" height="145" rx="20" fill="#f1e5cf"/><text x="24" y="43" class="badge" fill="#8e6a31">CLOUDFLARE WORKERS</text><text x="24" y="80" class="cardh">apps/website</text><text x="24" y="106" class="cardcopy">React, Next.js, Vite/Vinext</text><text x="24" y="126" class="cardcopy">and public Worker tooling.</text></g>
    <g transform="translate(1150 215)"><text x="0" y="-18" class="layer">APPLICATION LAYER</text><rect width="270" height="145" rx="20" fill="#f1e5cf"/><text x="24" y="43" class="badge" fill="#8e6a31">CLOUDFLARE WORKER</text><text x="24" y="80" class="cardh">apps/platform</text><text x="24" y="106" class="cardcopy">Protected routes, document</text><text x="24" y="126" class="cardcopy">flows and permission checks.</text></g>

    <g transform="translate(425 474)"><text x="0" y="-18" class="layer">PERSISTENCE / FILES</text><rect width="350" height="128" rx="20" fill="#0d314b" stroke="#507083"/><text x="26" y="38" class="badge" fill="#caa866">CLOUDFLARE D1</text><text x="26" y="77" class="darkh">Structured platform data</text><text x="26" y="104" class="darkcopy">Backend-mediated access for persisted work.</text></g>
    <g transform="translate(825 474)"><text x="0" y="-18" class="layer">PERSISTENCE / FILES</text><rect width="350" height="128" rx="20" fill="#0d314b" stroke="#507083"/><text x="26" y="38" class="badge" fill="#caa866">PRIVATE CLOUDFARE R2</text><text x="26" y="77" class="darkh">Documents &amp; generated files</text><text x="26" y="104" class="darkcopy">Private object handling through application routes.</text></g>

    <g transform="translate(350 646)"><text x="0" y="-18" class="layer">SERVER-SIDE INTEGRATIONS</text><rect width="290" height="72" rx="17" fill="#f8f6f2"/><text x="22" y="30" class="badge" fill="#9b773b">AI LAYER</text><text x="22" y="55" class="cardh">OpenAI integration</text></g>
    <g transform="translate(655 646)"><text x="0" y="-18" class="layer">SERVER-SIDE INTEGRATIONS</text><rect width="290" height="72" rx="17" fill="#f8f6f2"/><text x="22" y="30" class="badge" fill="#9b773b">AUTH / EMAIL</text><text x="22" y="55" class="cardh">OTP provider settings</text></g>
    <g transform="translate(960 646)"><text x="0" y="-18" class="layer">ADMINISTRATIVE SURFACE</text><rect width="290" height="72" rx="17" fill="#f8f6f2" stroke="#a3b5bd" stroke-dasharray="7 7"/><text x="22" y="30" class="badge" fill="#879aa4">PARTIAL</text><text x="22" y="55" class="cardh">apps/admin Worker</text></g>
  </g>
  <g class="ui"><path d="M100 769H164" stroke="#BE974F" stroke-width="3"/><text x="180" y="774" fill="#b9c9d2" font-size="13">Implemented connection</text><path d="M415 769H479" stroke="#8fa3ad" stroke-width="3" stroke-dasharray="8 8"/><text x="495" y="774" fill="#b9c9d2" font-size="13">Partial surface</text><text x="1000" y="774" fill="#b9c9d2" font-size="13">Credentials stay server-side; browser code does not receive AI secrets.</text></g>
</svg>
