<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">JURO — Юрист в кармане</title>
  <desc id="desc">JURO LegalTech banner showing a source-aware legal workspace, document workflow and human lawyer hand-off for Uzbekistan.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#041f37"/><stop offset="1" stop-color="#062844"/></linearGradient>
    <radialGradient id="aura" cx="74%" cy="35%" r="58%"><stop stop-color="#BE974F" stop-opacity=".24"/><stop offset=".58" stop-color="#BE974F" stop-opacity=".05"/><stop offset="1" stop-color="#BE974F" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000d18" flood-opacity=".42"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#dce6ed" stroke-opacity=".055"/></pattern>
    <style>
      .ui{font-family:Inter,Manrope,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.eyebrow{fill:#caa866;font-size:12px;font-weight:800;letter-spacing:2.1px}.body{fill:#c7d3db;font-size:17px}.micro{fill:#92a9b7;font-size:12px}.chip{fill:#f4f1e9;font-size:11px;font-weight:800;letter-spacing:1.1px}.tiny{fill:#9eb3bf;font-size:10px;font-weight:800;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1600" height="640" fill="url(#background)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>
  <rect width="1600" height="640" fill="url(#aura)"/>
  <path d="M820 0C1040 124 1130 103 1600 73M985 640C1175 507 1366 508 1600 563" fill="none" stroke="#BE974F" stroke-opacity=".18"/>
  <path d="M76 550C258 527 400 560 562 640" fill="none" stroke="#e4edf1" stroke-opacity=".12"/>

  <g class="ui">
    <image href="juro-mark.png" x="78" y="55" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
    <text x="145" y="88" fill="#fff" font-size="29" font-weight="800" letter-spacing="7">JURO</text>
    <text x="78" y="168" class="eyebrow">LEGAL INTELLIGENCE FOR UZBEKISTAN</text>
    <text x="78" y="247" class="serif" fill="#fff" font-size="62" font-weight="700">Юрист в кармане</text>
    <text x="78" y="293" class="body">Legal information, document workflows and</text>
    <text x="78" y="320" class="body">a clear path to human help in one workspace.</text>

    <g transform="translate(78 365)">
      <rect width="142" height="42" rx="21" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".17"/>
      <circle cx="20" cy="21" r="5" fill="#BE974F"/><text x="35" y="25" class="chip">AI &amp; SOURCES</text>
      <rect x="154" width="137" height="42" rx="21" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".17"/>
      <circle cx="174" cy="21" r="5" fill="#BE974F"/><text x="189" y="25" class="chip">DOCUMENTS</text>
      <rect x="303" width="160" height="42" rx="21" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".17"/>
      <circle cx="323" cy="21" r="5" fill="#BE974F"/><text x="338" y="25" class="chip">CASE WORK</text>
    </g>
    <g transform="translate(78 558)">
      <text class="tiny" x="0" y="0">RU · UZ · EN</text><circle cx="112" cy="-4" r="3" fill="#BE974F"/><text class="micro" x="126" y="0">juro.uz</text><circle cx="215" cy="-4" r="3" fill="#BE974F"/><text class="micro" x="229" y="0">app.juro.uz</text>
    </g>
  </g>

  <g class="ui" filter="url(#shadow)">
    <rect x="830" y="74" width="626" height="476" rx="26" fill="#f8f6f2"/>
    <rect x="830" y="74" width="626" height="62" rx="26" fill="#0c2b43"/>
    <rect x="830" y="111" width="626" height="25" fill="#0c2b43"/>
    <circle cx="864" cy="105" r="5" fill="#BE974F"/><circle cx="882" cy="105" r="5" fill="#f8f6f2" fill-opacity=".7"/><circle cx="900" cy="105" r="5" fill="#f8f6f2" fill-opacity=".35"/>
    <text x="930" y="110" fill="#e6eef1" font-size="11" font-weight="800" letter-spacing="1.4">JURO / LEGAL WORKSPACE</text>

    <text x="870" y="183" fill="#062844" font-size="28" font-weight="800">Start with the situation.</text>
    <text x="870" y="211" fill="#607987" font-size="15">Keep the source and the next action in view.</text>
    <rect x="870" y="244" width="544" height="104" rx="16" fill="#fff" stroke="#d7e0e4"/>
    <text x="894" y="273" fill="#9b773b" font-size="10" font-weight="800" letter-spacing="1.2">LEGAL CONTEXT</text>
    <text x="894" y="303" fill="#062844" font-size="18" font-weight="800">What should I do after receiving this notice?</text>
    <text x="894" y="328" fill="#6a818e" font-size="13">Relevant facts, source checks and a practical path forward.</text>

    <g transform="translate(870 376)">
      <rect width="160" height="122" rx="16" fill="#062844"/><text x="20" y="28" fill="#caa866" font-size="10" font-weight="800" letter-spacing="1.2">01 / ASK</text><text x="20" y="62" fill="#fff" font-size="18" font-weight="800">Question</text><text x="20" y="88" class="micro">Facts &amp; context</text>
      <rect x="176" width="160" height="122" rx="16" fill="#e6edef"/><text x="196" y="28" fill="#9b773b" font-size="10" font-weight="800" letter-spacing="1.2">02 / CHECK</text><text x="196" y="62" fill="#062844" font-size="18" font-weight="800">Sources</text><text x="196" y="88" fill="#607987" font-size="12">Visible citations</text>
      <rect x="352" width="192" height="122" rx="16" fill="#f1e5cf"/><text x="372" y="28" fill="#9b773b" font-size="10" font-weight="800" letter-spacing="1.2">03 / ACT</text><text x="372" y="62" fill="#062844" font-size="18" font-weight="800">Next step</text><text x="372" y="88" fill="#607987" font-size="12">Document, case or hand-off</text>
    </g>
  </g>
  <g filter="url(#shadow)" class="ui">
    <rect x="1328" y="360" width="174" height="218" rx="27" fill="#08243a" stroke="#caa866" stroke-width="2"/>
    <rect x="1342" y="382" width="146" height="31" rx="10" fill="#fff" fill-opacity=".10"/>
    <text x="1357" y="402" fill="#f8f6f2" font-size="10" font-weight="800" letter-spacing="1.1">JURO · MOBILE</text>
    <text x="1347" y="449" fill="#caa866" font-size="10" font-weight="800" letter-spacing="1.1">SOURCE CARD</text>
    <text x="1347" y="481" fill="#fff" font-size="16" font-weight="800">Inspect the</text><text x="1347" y="503" fill="#fff" font-size="16" font-weight="800">legal source</text>
    <rect x="1347" y="531" width="116" height="20" rx="10" fill="#BE974F"/>
  </g>
</svg>
