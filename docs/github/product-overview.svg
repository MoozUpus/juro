<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">JURO product ecosystem</title>
  <desc id="desc">JURO product map: legal information, document work, analysis, cases and a partial human-lawyer hand-off.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#062844"/><stop offset="1" stop-color="#031b2e"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="48%"><stop stop-color="#BE974F" stop-opacity=".17"/><stop offset="1" stop-color="#BE974F" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00111f" flood-opacity=".4"/></filter>
    <style>.ui{font-family:Inter,Manrope,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.h{fill:#fff;font-size:48px;font-weight:700}.copy{fill:#b8c8d1;font-size:17px}.card{fill:#f8f6f2}.kicker{fill:#caa866;font-size:11px;font-weight:800;letter-spacing:1.4px}.cardh{fill:#062844;font-size:20px;font-weight:800}.cardcopy{fill:#607987;font-size:14px}.status{font-size:10px;font-weight:800;letter-spacing:1.2px}</style>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/><rect width="1600" height="820" fill="url(#glow)"/>
  <path d="M0 105H1600M0 710H1600M90 0V820M1510 0V820" stroke="#dce6ed" stroke-opacity=".08"/>
  <g class="ui"><text x="100" y="99" class="h serif">One legal workspace. One connected context.</text><text x="100" y="137" class="copy">The map separates implemented work from partial hand-off and planned commercial surfaces.</text></g>

  <g fill="none" stroke="#BE974F" stroke-width="2.5"><path d="M558 386H442V270"/><path d="M558 467H442V600"/><path d="M1042 386H1158V270"/><path d="M1042 467H1158V600"/><path d="M800 323V232"/></g>
  <g fill="none" stroke="#8ca0aa" stroke-width="2.5" stroke-dasharray="8 9"><path d="M800 540V660"/><path d="M449 656H630"/><path d="M1151 656H970"/></g>

  <g class="ui" filter="url(#shadow)">
    <rect x="558" y="323" width="484" height="217" rx="28" fill="#f8f6f2"/>
    <image href="juro-mark.png" x="603" y="363" width="52" height="52"/>
    <text x="683" y="398" fill="#062844" font-size="29" font-weight="800" letter-spacing="5">JURO</text>
    <text x="603" y="451" class="kicker">CURRENT PRODUCT CORE</text>
    <text x="603" y="488" fill="#062844" font-size="25" font-weight="800">Legal information, documents</text><text x="603" y="518" fill="#062844" font-size="25" font-weight="800">and practical next actions.</text>

    <rect x="132" y="160" width="310" height="142" rx="19" class="card"/><text x="158" y="191" class="status" fill="#9b773b">WORKING</text><text x="158" y="229" class="cardh">AI legal information</text><text x="158" y="255" class="cardcopy">Questions, source cards and</text><text x="158" y="276" class="cardcopy">citation-aware responses.</text>

    <rect x="1158" y="160" width="310" height="142" rx="19" class="card"/><text x="1184" y="191" class="status" fill="#9b773b">PARTIAL</text><text x="1184" y="229" class="cardh">Document intelligence</text><text x="1184" y="255" class="cardcopy">Review, comparison and</text><text x="1184" y="276" class="cardcopy">risk-oriented workflows.</text>

    <rect x="132" y="572" width="310" height="142" rx="19" class="card"/><text x="158" y="603" class="status" fill="#9b773b">WORKING</text><text x="158" y="641" class="cardh">Documents &amp; storage</text><text x="158" y="667" class="cardcopy">Drafts, versions and generated</text><text x="158" y="688" class="cardcopy">files in protected workflows.</text>

    <rect x="1158" y="572" width="310" height="142" rx="19" class="card"/><text x="1184" y="603" class="status" fill="#9b773b">WORKING</text><text x="1184" y="641" class="cardh">Cases &amp; action plans</text><text x="1184" y="667" class="cardcopy">Deadlines, actions and legal</text><text x="1184" y="688" class="cardcopy">context linked to a case.</text>

    <rect x="645" y="132" width="310" height="100" rx="17" fill="#112f48" stroke="#caa866" stroke-opacity=".55"/><text x="671" y="161" class="status" fill="#caa866">WORKING</text><text x="671" y="200" fill="#fff" font-size="19" font-weight="800">Source-aware answers</text>

    <rect x="622" y="660" width="356" height="108" rx="18" fill="#112f48" stroke="#a9bac3" stroke-dasharray="8 8"/><text x="650" y="690" class="status" fill="#caa866">PARTIAL / HUMAN WORKFLOW</text><text x="650" y="728" fill="#fff" font-size="19" font-weight="800">Lawyer profiles, hand-off &amp; admin</text>
  </g>
  <g class="ui"><rect x="100" y="752" width="402" height="40" rx="20" fill="#f1e5cf"/><text x="123" y="777" fill="#8e6a31" font-size="11" font-weight="800" letter-spacing="1">PLANNED</text><text x="218" y="777" fill="#062844" font-size="13" font-weight="700">Payments and wider integrations</text><path d="M1035 772H1103" stroke="#BE974F" stroke-width="3"/><text x="1118" y="777" fill="#b8c8d1" font-size="13">Implemented / working</text><path d="M1314 772H1382" stroke="#8ca0aa" stroke-width="3" stroke-dasharray="8 8"/><text x="1396" y="777" fill="#b8c8d1" font-size="13">Partial / planned</text></g>
</svg>
