<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">JURO product experience</title>
  <desc id="desc">An original JURO product illustration showing legal information, protected document work and partial review or human hand-off surfaces. It is not a live interface screenshot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#041f37"/><stop offset="1" stop-color="#062844"/></linearGradient>
    <radialGradient id="glow" cx="88%" cy="18%" r="68%"><stop stop-color="#BE974F" stop-opacity=".18"/><stop offset="1" stop-color="#BE974F" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#dce6ed" stroke-opacity=".055"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#001525" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1600" height="940" fill="url(#background)"/>
  <rect width="1600" height="940" fill="url(#grid)"/>
  <rect width="1600" height="940" fill="url(#glow)"/>
  <path d="M1280 0C1220 116 1320 202 1600 140" fill="none" stroke="#BE974F" stroke-opacity=".23"/>
  <text x="80" y="74" fill="#caa866" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8">JURO / PRODUCT EXPERIENCE</text>
  <text x="80" y="128" fill="#fff" font-family="Georgia,serif" font-size="52" font-weight="700">From legal context to coordinated work.</text>
  <text x="80" y="166" fill="#b9c9d2" font-family="Inter,Arial,sans-serif" font-size="18">A deliberate product view: clear boundaries, useful next steps and no invented product claims.</text>
  <g font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">
    <rect x="1086" y="62" width="120" height="32" rx="16" fill="#BE974F"/><text x="1146" y="83" text-anchor="middle" fill="#062844">LIVE ENTRY</text>
    <rect x="1218" y="62" width="144" height="32" rx="16" fill="#173f5a" stroke="#5f8299"/><text x="1290" y="83" text-anchor="middle" fill="#f8f6f2">WORKING FLOWS</text>
    <rect x="1374" y="62" width="146" height="32" rx="16" fill="none" stroke="#b9c9d2" stroke-dasharray="5 5"/><text x="1447" y="83" text-anchor="middle" fill="#d7e3e8">PARTIAL SURFACES</text>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="80" y="212" width="1440" height="42" rx="21" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="104" cy="233" r="6" fill="#BE974F"/>
    <text x="122" y="238" fill="#f8f6f2" font-size="12" font-weight="800" letter-spacing="1.2">PUBLIC ENTRY / LIVE</text>
    <text x="328" y="238" fill="#b9c9d2" font-size="14">juro.uz</text>
    <path d="M424 233H1450" stroke="#BE974F" stroke-opacity=".52"/>
    <circle cx="1450" cy="233" r="5" fill="#BE974F"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="80" y="286" width="450" height="500" rx="26" fill="#f8f6f2"/>
    <rect x="575" y="286" width="450" height="500" rx="26" fill="#f8f6f2"/>
    <rect x="1070" y="286" width="450" height="500" rx="26" fill="#f8f6f2"/>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="120" y="338" fill="#A8792F" font-size="12" font-weight="800" letter-spacing="1.5">01 / UNDERSTAND</text>
    <rect x="395" y="314" width="95" height="30" rx="15" fill="#e8d7ad"/><text x="442" y="334" text-anchor="middle" fill="#6a4c1d" font-size="10" font-weight="800" letter-spacing="1">WORKING</text>
    <text x="120" y="394" fill="#062844" font-family="Georgia,serif" font-size="35" font-weight="700">Describe the</text>
    <text x="120" y="434" fill="#062844" font-family="Georgia,serif" font-size="35" font-weight="700">situation.</text>
    <text x="120" y="470" fill="#58758a" font-size="16">Begin with a question or document.</text>
    <rect x="120" y="510" width="370" height="122" rx="18" fill="#ffffff" stroke="#d7e3e8"/>
    <text x="146" y="545" fill="#A8792F" font-size="10" font-weight="800" letter-spacing="1.2">LEGAL INFORMATION</text>
    <text x="146" y="580" fill="#062844" font-size="20" font-weight="700">What needs attention?</text>
    <rect x="146" y="598" width="168" height="18" rx="9" fill="#eaf0f2"/><text x="230" y="611" text-anchor="middle" fill="#4e7187" font-size="9" font-weight="800">CONTEXT FIRST</text>
    <rect x="120" y="660" width="178" height="64" rx="16" fill="#062844"/><circle cx="146" cy="691" r="6" fill="#BE974F"/><text x="163" y="695" fill="#fff" font-size="14" font-weight="700">Request context</text>
    <rect x="312" y="660" width="178" height="64" rx="16" fill="#e7eef1"/><path d="M340 691h20" stroke="#BE974F" stroke-width="3"/><text x="374" y="695" fill="#062844" font-size="14" font-weight="700">Evidence boundary</text>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="615" y="338" fill="#A8792F" font-size="12" font-weight="800" letter-spacing="1.5">02 / PREPARE</text>
    <rect x="890" y="314" width="95" height="30" rx="15" fill="#e8d7ad"/><text x="937" y="334" text-anchor="middle" fill="#6a4c1d" font-size="10" font-weight="800" letter-spacing="1">WORKING</text>
    <text x="615" y="394" fill="#062844" font-family="Georgia,serif" font-size="35" font-weight="700">Turn context</text>
    <text x="615" y="434" fill="#062844" font-family="Georgia,serif" font-size="35" font-weight="700">into work.</text>
    <text x="615" y="470" fill="#58758a" font-size="16">Keep the next draft and action connected.</text>
    <rect x="615" y="510" width="370" height="66" rx="16" fill="#062844"/>
    <text x="643" y="537" fill="#caa866" font-size="10" font-weight="800" letter-spacing="1.2">DOCUMENT WORKFLOW</text>
    <text x="643" y="559" fill="#fff" font-size="17" font-weight="700">Drafts, generated files and cases</text>
    <g>
      <rect x="615" y="594" width="112" height="130" rx="18" fill="#e7eef1"/><text x="637" y="625" fill="#A8792F" font-size="10" font-weight="800" letter-spacing="1">DRAFT</text><path d="M637 646h68M637 662h52M637 678h60" stroke="#668195" stroke-width="4" stroke-linecap="round"/><circle cx="692" cy="703" r="12" fill="#BE974F"/><path d="M688 703h8" stroke="#062844" stroke-width="2"/>
      <rect x="744" y="594" width="112" height="130" rx="18" fill="#e7eef1"/><text x="766" y="625" fill="#A8792F" font-size="10" font-weight="800" letter-spacing="1">FILES</text><path d="M766 650h68v15h-68z" fill="#fff" stroke="#668195"/><path d="M766 678h54v15h-54z" fill="#fff" stroke="#668195"/><circle cx="824" cy="703" r="12" fill="#BE974F"/><path d="M820 703h8" stroke="#062844" stroke-width="2"/>
      <rect x="873" y="594" width="112" height="130" rx="18" fill="#e7eef1"/><text x="895" y="625" fill="#A8792F" font-size="10" font-weight="800" letter-spacing="1">ACTION</text><circle cx="902" cy="654" r="6" fill="#BE974F"/><path d="M916 654h42M916 678h33M916 702h46" stroke="#668195" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="1110" y="338" fill="#A8792F" font-size="12" font-weight="800" letter-spacing="1.5">03 / REVIEW</text>
    <rect x="1367" y="314" width="113" height="30" rx="15" fill="none" stroke="#8da6b5" stroke-dasharray="4 4"/><text x="1423" y="334" text-anchor="middle" fill="#58758a" font-size="10" font-weight="800" letter-spacing="1">PARTIAL</text>
    <text x="1110" y="394" fill="#062844" font-family="Georgia,serif" font-size="35" font-weight="700">Review, compare,</text>
    <text x="1110" y="434" fill="#062844" font-family="Georgia,serif" font-size="35" font-weight="700">decide.</text>
    <text x="1110" y="470" fill="#58758a" font-size="16">Keep the uncertainty visible when it matters.</text>
    <rect x="1110" y="510" width="370" height="74" rx="16" fill="#e7eef1"/>
    <rect x="1130" y="528" width="72" height="36" rx="10" fill="#fff" stroke="#9ab1bd"/><text x="1166" y="551" text-anchor="middle" fill="#062844" font-size="11" font-weight="800">VERSION A</text>
    <path d="M1217 546h45" stroke="#BE974F" stroke-width="3"/><path d="m1254 538 12 8-12 8" fill="none" stroke="#BE974F" stroke-width="3"/>
    <rect x="1276" y="528" width="72" height="36" rx="10" fill="#fff" stroke="#9ab1bd"/><text x="1312" y="551" text-anchor="middle" fill="#062844" font-size="11" font-weight="800">VERSION B</text>
    <rect x="1364" y="528" width="92" height="36" rx="18" fill="#062844"/><text x="1410" y="551" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">COMPARE</text>
    <rect x="1110" y="604" width="370" height="56" rx="14" fill="#fff" stroke="#d7e3e8"/><circle cx="1135" cy="632" r="7" fill="#BE974F"/><text x="1154" y="637" fill="#062844" font-size="15" font-weight="700">Citation-oriented review surface</text>
    <rect x="1110" y="678" width="370" height="46" rx="14" fill="none" stroke="#809dab" stroke-dasharray="6 6"/><text x="1135" y="707" fill="#58758a" font-size="14" font-weight="700">Human lawyer hand-off where available</text>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <path d="M80 836H1520" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="80" y="874" fill="#d7e3e8" font-size="15">Availability depends on protected access and release state; status labels map to the repository matrix.</text>
    <text x="1520" y="874" text-anchor="end" fill="#caa866" font-size="12" font-weight="800" letter-spacing="1.2">PRODUCT ILLUSTRATION · NOT A LIVE SCREENSHOT</text>
  </g>
</svg>
