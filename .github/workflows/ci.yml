name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/website
          - apps/platform

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify generated Cloudflare types
        if: matrix.app == 'apps/platform'
        run: npm run cf:types:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Validate deployable artifact
        run: npm run validate:artifact

      - name: Validate Cloudflare environment matrix
        if: matrix.app == 'apps/platform'
        run: npm run validate:cloudflare:matrix

      - name: Audit platform production dependencies
        if: matrix.app == 'apps/platform'
        run: npm audit --omit=dev --audit-level=high

  # Temporary branch-only verification. This job is removed after the manual
  # dispatch proves that repository secrets work on GitHub's Ubuntu runner.
  verify-production-dry-runs:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - website
          - platform
          - admin
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out verification revision
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Require repository credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Install website dependencies
        if: matrix.target == 'website'
        working-directory: apps/website
        run: npm ci

      - name: Dry-run juro.uz
        if: matrix.target == 'website'
        working-directory: apps/website
        run: npm run deploy:production -- --dry-run

      - name: Install platform toolchain
        if: matrix.target == 'platform' || matrix.target == 'admin'
        working-directory: apps/platform
        run: npm ci

      - name: Dry-run app.juro.uz
        if: matrix.target == 'platform'
        working-directory: apps/platform
        run: node scripts/deploy-production.mjs --dry-run

      - name: Type-check admin Worker
        if: matrix.target == 'admin'
        working-directory: apps/admin
        run: npm run type-check

      - name: Dry-run admin.juro.uz
        if: matrix.target == 'admin'
        working-directory: apps/admin
        run: npm run check:production
