name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/website
          - apps/platform

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify generated Cloudflare types
        if: matrix.app == 'apps/platform'
        run: npm run cf:types:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Validate deployable artifact
        run: npm run validate:artifact

      - name: Validate Cloudflare environment matrix
        if: matrix.app == 'apps/platform'
        run: npm run validate:cloudflare:matrix

      - name: Audit platform production dependencies
        if: matrix.app == 'apps/platform'
        run: npm audit --omit=dev --audit-level=high

      - name: Enforce dependency licence policy
        run: npm run license:check
