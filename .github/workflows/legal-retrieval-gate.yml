name: Legal retrieval artifact gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/legal-retrieval-gate.yml"
      - "apps/platform/app/api/guest/ai/route.ts"
      - "apps/platform/app/api/platform/ai/route.ts"
      - "apps/platform/lib/legal-corpus/**"
      - "apps/platform/tests/legal-corpus-chat-retrieval.test.ts"
      - "apps/platform/tests/legal-corpus-worker-boundary.test.ts"
      - "apps/platform/tests/legal-custom-*.test.ts"
      - "apps/platform/tests/legal-target-*.test.ts"
      - "apps/platform/worker/legal-*.ts"
      - "apps/platform/wrangler.legal-*.jsonc"
      - "apps/platform/package-lock.json"
      - "apps/platform/package.json"

permissions:
  contents: read

concurrency:
  group: legal-retrieval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-retrieval-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/platform

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test legal retrieval deadline and Worker boundaries
        run: >-
          node --experimental-loader ./scripts/cloudflare-workers-loader.mjs
          --import tsx --test
          tests/legal-corpus-chat-retrieval.test.ts
          tests/legal-corpus-worker-boundary.test.ts

      - name: Validate production legal retrieval artifacts
        run: npm run validate:legal-retrieval:production
