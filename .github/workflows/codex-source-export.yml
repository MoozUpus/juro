name: Codex source export

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Package source
        shell: bash
        run: tar --exclude=.git --exclude=node_modules --exclude=.next --exclude=dist -czf /tmp/juro-source.tgz .
      - name: Upload private artifact
        uses: actions/upload-artifact@v4
        with:
          name: juro-source-${{ github.sha }}
          path: /tmp/juro-source.tgz
          retention-days: 1
          if-no-files-found: error
