name: Deploy production

on:
  # Use the base-repository context so a merged PR can deploy even when its
  # source was a fork or Dependabot. No PR code or secret-bearing job runs
  # before GitHub records the PR as merged.
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  changes:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      website: ${{ steps.paths.outputs.website }}
      platform: ${{ steps.paths.outputs.platform }}
      admin: ${{ steps.paths.outputs.admin }}

    steps:
      - name: Check out merged revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Select production targets
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          website=false
          platform=false
          admin=false

          # Treat renames as a deletion plus an addition so moving a file out
          # of one deployable app still selects that app for deployment.
          changed_files="$RUNNER_TEMP/production-changed-files"
          git diff --name-only --no-renames -z "$BASE_SHA" "$MERGE_SHA" > "$changed_files"

          while IFS= read -r -d '' file; do
            case "$file" in
              apps/website/*)
                website=true
                ;;
              apps/platform/*)
                platform=true
                ;;
              apps/admin/*)
                admin=true
                ;;
            esac

            case "$file" in
              apps/platform/package.json|apps/platform/package-lock.json)
                # Admin intentionally uses Wrangler and TypeScript from the
                # platform installation, so these files affect both targets.
                admin=true
                ;;
            esac
          done < "$changed_files"

          {
            echo "website=$website"
            echo "platform=$platform"
            echo "admin=$admin"
          } >> "$GITHUB_OUTPUT"

  deploy-website:
    name: Deploy juro.uz
    needs:
      - changes
      - deploy-platform
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.website == 'true' &&
      (needs.deploy-platform.result == 'success' || needs.deploy-platform.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-juro-uz
      url: https://juro.uz
    defaults:
      run:
        working-directory: apps/website
    steps:
      - name: Check out merged revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Deploy public website
        run: npm run deploy:production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-platform:
    name: Deploy app.juro.uz
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-app-juro-uz
      url: https://app.juro.uz
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - name: Check out merged revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Deploy user platform
        run: npm run deploy:production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-admin:
    name: Deploy admin.juro.uz
    needs:
      - changes
      - deploy-platform
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.admin == 'true' &&
      (needs.deploy-platform.result == 'success' || needs.deploy-platform.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-admin-juro-uz
      url: https://admin.juro.uz
    steps:
      - name: Check out merged revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install locked platform toolchain
        working-directory: apps/platform
        run: npm ci

      - name: Type-check admin Worker
        working-directory: apps/admin
        run: npm run type-check

      - name: Validate production admin deployment
        working-directory: apps/admin
        run: npm run check:production

      - name: Deploy admin Worker
        working-directory: apps/admin
        run: npm run deploy:production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
