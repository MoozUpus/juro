name: Qdrant snapshot gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/qdrant-gate.yml"
      - "apps/platform/lib/legal-corpus/embeddings.ts"
      - "apps/platform/lib/legal-corpus/qdrant.ts"
      - "apps/platform/lib/legal-corpus/qdrant-indexing.ts"
      - "apps/platform/scripts/verify-qdrant-snapshot-gate.ts"
      - "apps/platform/package-lock.json"
      - "apps/platform/package.json"

permissions:
  contents: read

concurrency:
  group: qdrant-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      qdrant:
        image: qdrant/qdrant@sha256:da65a06bc75e42702f80c992b99c5144b0fbd675ae7a96d2991de0bf957b7071
        ports:
          - 6333:6333

    defaults:
      run:
        working-directory: apps/platform

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run real Qdrant query and snapshot restore gate
        run: npm run validate:legal-corpus:qdrant-gate
        env:
          QDRANT_GATE_URL: http://127.0.0.1:6333
          QDRANT_GATE_EVIDENCE_PATH: artifacts/qdrant-gate.json

      - name: Upload Qdrant gate evidence
        uses: actions/upload-artifact@v6
        with:
          name: qdrant-snapshot-gate-${{ github.run_id }}
          path: apps/platform/artifacts/qdrant-gate.json
          if-no-files-found: error
          retention-days: 30
